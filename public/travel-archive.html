$('#routes').innerHTML=groups.flatMap(([k,rs],i)=>['train','flight','car','metro'].map(type=>{const rr=rs.filter(r=>kind(r)===type);if(!rr.length)return '';const [a,b]=k.split(' ↔ ');if(a===b)return '';const [x,y]=point(cities[a]),[u,v]=point(cities[b]),dx=u-x,dy=v-y,bend=type==='flight'?.18:-.12,cx=(x+u)/2-dy*bend,cy=(y+v)/2+dx*bend;return '<path class="route-path" data-route="'+i+'" d="M'+x+','+y+' Q'+cx+','+cy+' '+u+','+v+'" stroke="'+routeColor(type)+'" stroke-width="'+(1.6+Math.sqrt(rr.length)*.5)+'" opacity="'+(.65+rr.length/max*.25)+'"><title>'+esc(k)+' · '+rr.length+' 段'+(type==='flight'?'航班':type==='car'?'自驾':type==='metro'?'地铁':'火车')+'</title></path>'})).join('');
const counts={};rows.forEach(r=>[r.a,r.b].forEach(c=>counts[c]=(counts[c]||0)+1));$('#nodes').innerHTML=Object.entries(counts).map(([name,n])=>{const [x,y]=point(cities[name]);return '<circle class="node" cx="'+x+'" cy="'+y+'" r="'+Math.min(6,2.2+Math.sqrt(n)*.45)+'"><title>'+name+' · '+n+' 次端点出现</title></circle><text class="city-label" data-anchor-x="'+x+'" data-anchor-y="'+y+'" x="'+(x+9)+'" y="'+(y+3)+'">'+name+'</text>'}).join('');
$('#mapCount').textContent=rows.length+' 段行程 / '+Object.keys(counts).length+' 座城市 / '+groups.length+' 组城市连线';showRanking();renderTable();}
function showRanking(){selected=null;$('#sideTitle').textContent='最常往返';$('#sideIntro').textContent='双向合并统计，点击查看日期和班次。';$('#reset').hidden=true;$('#routeList').className='';$('#routeList').innerHTML=groups.slice(0,7).map(([k,r],i)=>'<button class="route-button" data-route="'+i+'"><span>'+k+'</span><b>'+r.length+' 段</b></button>').join('')||'<p>暂无行程</p>';document.querySelectorAll('.route-path').forEach(p=>p.style.opacity='')}
function selectRoute(i){selected=i;const [k,rs]=groups[i];$('#sideTitle').textContent=k;$('#sideIntro').textContent=rs.length+' 段记录 · 按时间倒序';$('#reset').hidden=false;$('#routeList').className='detail';$('#routeList').innerHTML=rs.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(r=>'<div><small>'+r.date+' · '+r.kind+'</small><br>'+esc(r.from)+' → '+esc(r.to)+'<br><small>'+esc(r.code)+' · '+esc(r.time)+'</small></div>').join('');document.querySelectorAll('.route-path').forEach(p=>p.style.opacity=Number(p.dataset.route)===i?'1':'.06')}
function renderTable(){const q=$('#search').value.toLowerCase().trim();const rows=filtered().filter(r=>[r.from,r.to,r.a,r.b,r.date,r.code].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));$('#count').textContent=rows.length+' 条';$('#records').innerHTML=rows.map(r=>'<tr><td>'+r.date+'</td><td><span class="tag '+kind(r)+'">'+r.kind+'</span></td><td>'+esc(r.from)+' <span style="color:#a1ad9f">→</span> '+esc(r.to)+'</td><td>'+esc(r.code)+'</td><td>'+esc(r.time)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">没有匹配的行程</td></tr>'}
document.querySelectorAll('.legend button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.kind;document.querySelectorAll('.legend button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));$('#year').addEventListener('change',()=>render());$('#search').addEventListener('input',renderTable);$('#reset').addEventListener('click',showRanking);document.addEventListener('click',e=>{const x=e.target.closest('[data-route]');if(x)selectRoute(Number(x.dataset.route))});
const maxYear=Math.max(...years.map(y=>data.filter(r=>r.date.startsWith(y)).length));$('#years').innerHTML=years.slice().reverse().map(y=>{const n=data.filter(r=>r.date.startsWith(y)),rail=n.filter(r=>kind(r)==='train').length;return '<div class="year">'+n.length+'<div class="stack" style="height:'+Math.max(5,n.length/maxYear*65)+'px"><i style="height:'+rail/n.length*100+'%;background:var(--rail)"></i><i style="height:'+n.filter(r=>kind(r)==='flight').length/n.length*100+'%;background:var(--air)"></i><i style="height:'+n.filter(r=>kind(r)==='car').length/n.length*100+'%;background:#7355a3"></i><i style="height:'+n.filter(r=>kind(r)==='metro').length/n.length*100+'%;background:#2875ad"></i></div>'+y+'</div>'}).join('');
const annual=years.map(y=>[y,data.filter(r=>r.date.startsWith(y)).length]).sort((a,b)=>b[1]-a[1]);$('#insight').textContent=annual[0][0]+' 年留下了最多记录，共 '+annual[0][1]+' 段行程。火车、飞机、地铁与自驾，把 '+cityTotal+' 座城市连成了你的旅行网络。';render();

// 时间浏览使用每条记录的出发方向，不采用总览里的双向合并顺序。
let sequenceMode=false,stepIndex=0,sequence=[],playTimer=null;
const mapSvg=$('#map');
mapSvg.insertAdjacentHTML('beforeend','<defs><marker id="trip-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><g id="journey" class="journey-overlay"></g>');
$('.map-tools').insertAdjacentHTML('afterend','<div class="journey-controls"><button id="overview" aria-pressed="true">路线总览</button><button id="chronology" aria-pressed="false">按时间看</button><button id="prev" disabled aria-label="上一段行程">← 上一程</button><button id="play" disabled>播放</button><button id="next" disabled aria-label="下一段行程">下一程 →</button><input id="stepRange" type="range" min="0" max="0" value="0" disabled aria-label="按出发时间选择行程"><span class="journey-status" id="stepStatus">从最早一程开始</span></div>');
function pause(){if(playTimer!==null)clearInterval(playTimer);playTimer=null;controlIcon('#play','play','播放');$('#play').classList.remove('playing')}
function updateSequence(){sequence=filtered().slice().sort((a,b)=>(a.date+a.time.slice(0,5)).localeCompare(b.date+b.time.slice(0,5)));stepIndex=Math.min(stepIndex,Math.max(0,sequence.length-1));}
function tripCurve(r){const [x,y]=point(cities[r.a]),[u,v]=point(cities[r.b]);const bend=kind(r)==='flight'?.18:-.12;return {x,y,u,v,cx:(x+u)/2-(v-y)*bend,cy:(y+v)/2+(u-x)*bend};}
function paintStep(){updateSequence();const r=sequence[stepIndex];$('#overview').setAttribute('aria-pressed','false');$('#chronology').setAttribute('aria-pressed','true');$('#prev').disabled=!r||stepIndex===0;$('#next').disabled=!r||stepIndex===sequence.length-1;$('#play').disabled=!r;$('#stepRange').disabled=!r;$('#stepRange').max=String(Math.max(0,sequence.length-1));$('#stepRange').value=String(stepIndex);$('#stepStatus').textContent=r?(stepIndex+1)+' / '+sequence.length+' 段 · '+r.date:'当前筛选无记录';$('#reset').hidden=true;
document.querySelectorAll('.route-path').forEach(p=>p.style.opacity='.13');
if(!r){$('#journey').innerHTML='';$('#sideTitle').textContent='暂无行程';$('#sideIntro').textContent='请选择其他年份或交通方式';$('#routeList').innerHTML='';return}
const c=tripCurve(r),color=routeColor(kind(r)),d='M'+c.x+','+c.y+' Q'+c.cx+','+c.cy+' '+c.u+','+c.v;
// 箭头放在线段中部，避免被城市节点遮住；完整曲线仍抵达目的地。
const midX=(c.x+2*c.cx+c.u)/4,midY=(c.y+2*c.cy+c.v)/4,half='M'+c.x+','+c.y+' Q'+((c.x+c.cx)/2)+','+((c.y+c.cy)/2)+' '+midX+','+midY;
$('#journey').innerHTML='<path d="'+d+'" fill="none" stroke="#fffdf7" stroke-width="7"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="3.4"/><path class="flow-line" d="'+d+'" stroke="'+color+'"/><path class="direction-mark" d="'+half+'" fill="none" stroke="'+color+'" stroke-width="3.4" marker-end="url(#trip-arrow)"/><circle cx="'+c.x+'" cy="'+c.y+'" r="6" fill="white" stroke="'+color+'" stroke-width="2.5"/><circle cx="'+c.u+'" cy="'+c.v+'" r="6" fill="'+color+'" stroke="white" stroke-width="2"/><circle class="sequence-number" cx="'+midX+'" cy="'+(midY-19)+'" r="12" fill="'+color+'"/><text class="step-label" x="'+midX+'" y="'+(midY-19)+'">'+(stepIndex+1)+'</text>';
$('#sideTitle').textContent=r.a+' → '+r.b;$('#sideIntro').textContent=r.date+' '+r.time+' · '+r.code;$('#routeList').className='journey-detail';$('#routeList').innerHTML=''+sequence.map((s,i)=>'<button class="step-button" data-step="'+i+'" aria-current="'+(i===stepIndex)+'"><small>'+String(i+1).padStart(2,'0')+' · '+s.date+' '+s.time.slice(0,5)+'</small><br>'+esc(s.from)+' → '+esc(s.to)+'</button>').join('');const active=$('[data-step="'+stepIndex+'"]');if(active)$('#routeList').scrollTop=Math.max(0,active.offsetTop-$('#routeList').offsetTop-80);
}
const originalRender=render,originalRanking=showRanking,originalSelect=selectRoute;
function leaveSequence(){pause();sequenceMode=false;$('#journey').innerHTML='';$('#overview').setAttribute('aria-pressed','true');$('#chronology').setAttribute('aria-pressed','false');['#prev','#next','#play','#stepRange'].forEach(s=>$(s).disabled=true);$('#stepStatus').textContent='从最早一程开始'}
render=function(){pause();stepIndex=0;originalRender();if(sequenceMode)paintStep()};
selectRoute=function(i){leaveSequence();originalSelect(i)};
$('#overview').addEventListener('click',()=>{leaveSequence();originalRanking()});$('#chronology').addEventListener('click',()=>{pause();sequenceMode=true;stepIndex=0;paintStep()});
function moveStep(n){pause();stepIndex=Math.max(0,Math.min(sequence.length-1,n));paintStep()}
$('#prev').addEventListener('click',()=>moveStep(stepIndex-1));$('#next').addEventListener('click',()=>moveStep(stepIndex+1));$('#stepRange').addEventListener('input',()=>moveStep(Number($('#stepRange').value)));
document.addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(b)moveStep(Number(b.dataset.step))});
$('#play').addEventListener('click',()=>{if(playTimer!==null){pause();return}if(stepIndex===sequence.length-1)stepIndex=0;paintStep();controlIcon('#play','pause','暂停');$('#play').classList.add('playing');playTimer=setInterval(()=>{if(stepIndex>=sequence.length-1){pause();return}stepIndex++;paintStep();if(stepIndex===sequence.length-1)pause()},1800)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',pause);

// 通过 viewBox 缩放地图与轨迹，保持两者坐标一致。
const view={x:0,y:0,w:920,h:630},pointers=new Map();let dragMoved=false;
$('.canvas').insertAdjacentHTML('beforeend','<div class="zoom-tools" aria-label="地图视图控制"><button id="zoomOut" aria-label="缩小地图">−</button><output id="zoomLevel">100%</output><button id="zoomIn" aria-label="放大地图">＋</button><button id="zoomReset">复位</button><button id="mapFullscreen" aria-pressed="false">全屏</button></div>');
$('#mapFullscreen').addEventListener('click',async()=>{
 const shell=$('.map-shell'),button=$('#mapFullscreen');button.disabled=true;
 try{if(document.fullscreenElement===shell)await document.exitFullscreen();else await shell.requestFullscreen()}
 catch(error){alert('当前浏览器未能进入全屏，请检查是否支持或允许全屏。')}
 finally{button.disabled=false}
});
document.addEventListener('fullscreenchange',()=>{const active=document.fullscreenElement===$('.map-shell');controlIcon('#mapFullscreen',active?'exit':'expand',active?'退出全屏':'全屏');$('#mapFullscreen').setAttribute('aria-pressed',String(active));syncScreenSizes()});
function applyView(){mapSvg.setAttribute('viewBox',[view.x,view.y,view.w,view.h].join(' '));$('#zoomLevel').textContent=Math.round(920/view.w*100)+'%';$('#zoomIn').disabled=view.w<=115;$('#zoomOut').disabled=view.w>=1150}
function screenPoint(x,y){const p=mapSvg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(mapSvg.getScreenCTM().inverse())}
function zoomBy(factor,anchor){const a=anchor||{x:view.x+view.w/2,y:view.y+view.h/2};const w=Math.max(115,Math.min(1150,view.w/factor)),ratio=w/view.w;view.x=a.x-(a.x-view.x)*ratio;view.y=a.y-(a.y-view.y)*ratio;view.w=w;view.h=w*630/920;applyView()}
$('#zoomIn').addEventListener('click',()=>zoomBy(1.35));$('#zoomOut').addEventListener('click',()=>zoomBy(1/1.35));$('#zoomReset').addEventListener('click',()=>{Object.assign(view,{x:0,y:0,w:920,h:630});applyView()});
mapSvg.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.exp(-Math.max(-100,Math.min(100,e.deltaY))*.003),screenPoint(e.clientX,e.clientY))},{passive:false});
mapSvg.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragMoved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});mapSvg.setPointerCapture(e.pointerId);mapSvg.classList.add('dragging')});
mapSvg.addEventListener('pointermove',e=>{const prev=pointers.get(e.pointerId);if(!prev)return;const before=screenPoint(prev.x,prev.y),now=screenPoint(e.clientX,e.clientY);if(Math.abs(prev.x-e.clientX)+Math.abs(prev.y-e.clientY)>2)dragMoved=true;view.x+=before.x-now.x;view.y+=before.y-now.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});applyView()});
function endDrag(e){pointers.delete(e.pointerId);if(!pointers.size)mapSvg.classList.remove('dragging')};mapSvg.addEventListener('pointerup',endDrag);mapSvg.addEventListener('pointercancel',endDrag);
mapSvg.addEventListener('click',e=>{if(dragMoved){e.preventDefault();e.stopImmediatePropagation();dragMoved=false}},{capture:true});
function drawOverview(){updateSequence();const buckets=new Map();sequence.forEach((r,i)=>{const k=key(r);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(i)});
$('#routes').innerHTML=sequence.map((r,i)=>{const c=tripCurve(r),same=buckets.get(key(r)),rank=same.indexOf(i),dx=c.u-c.x,dy=c.v-c.y,len=Math.hypot(dx,dy)||1;const offset=(rank-(same.length-1)/2)*11;const sign=r.a<r.b?1:-1;c.cx+=-dy/len*offset*sign;c.cy+=dx/len*offset*sign;const t=.38+(rank%4)*.1,mx=(1-t)*(1-t)*c.x+2*(1-t)*t*c.cx+t*t*c.u,my=(1-t)*(1-t)*c.y+2*(1-t)*t*c.cy+t*t*c.v,color=routeColor(kind(r));const full='M'+c.x+','+c.y+' Q'+c.cx+','+c.cy+' '+c.u+','+c.v,part='M'+c.x+','+c.y+' Q'+(c.x+t*(c.cx-c.x))+','+(c.y+t*(c.cy-c.y))+' '+mx+','+my;const lx=mx,ly=my-13;return '<g data-overview="'+i+'"><path class="route-path" d="'+full+'" stroke="'+color+'" stroke-width="1.9" opacity=".78"><title>#'+(i+1)+' '+r.date+' '+esc(r.from)+' → '+esc(r.to)+' '+esc(r.code)+'</title></path><path class="flow-line" d="'+full+'" stroke="'+color+'"/><path d="'+part+'" fill="none" stroke="'+color+'" stroke-width="1.9" class="direction-mark" marker-end="url(#trip-arrow)" pointer-events="none"/><g class="order-badge" transform="translate('+lx+','+ly+')"><circle r="9" fill="'+color+'" stroke="#fffdf7" stroke-width="1"/><text>'+ (i+1)+'</text></g></g>'}).join('');
$('#sideTitle').textContent='行程序号';$('#sideIntro').textContent='按时间排序 · 点击查看';$('#routeList').className='journey-detail';$('#routeList').innerHTML=sequence.map((r,i)=>'<button class="step-button overview-item" data-overview="'+i+'"><small>#'+(i+1)+' · '+r.date+' '+r.time.slice(0,5)+'</small><br>'+esc(r.from)+' → '+esc(r.to)+'</button>').join('')||'<p>暂无行程</p>';$('#reset').hidden=true;$('#stepStatus').textContent='总览 · '+sequence.length+' 段（由早到晚）';
}
function overviewDetail(i){const r=sequence[i];document.querySelectorAll('#routes > g').forEach((g,j)=>{g.style.opacity=j===i?'1':'.12';g.querySelectorAll('.flow-line').forEach(line=>line.style.animationPlayState=j===i?'running':'paused')});$('#sideTitle').textContent='#'+(i+1)+' '+r.a+' → '+r.b;$('#sideIntro').textContent=r.date+' '+r.time+' · '+r.code;$('#reset').hidden=false;document.querySelectorAll('.overview-item').forEach((b,j)=>b.setAttribute('aria-current',String(i===j)))}
const renderBeforeZoom=render;render=function(){renderBeforeZoom();if(!sequenceMode)drawOverview()};
$('#overview').addEventListener('click',drawOverview);$('#reset').addEventListener('click',()=>{if(!sequenceMode)drawOverview()});document.addEventListener('click',e=>{const b=e.target.closest('[data-overview]');if(b&&!sequenceMode)overviewDetail(Number(b.dataset.overview))});
applyView();drawOverview();

// 开关状态放在 SVG 上，筛选与重绘轨迹不会重置用户选择。
let annotationsVisible=true;
$('.journey-controls').insertAdjacentHTML('beforeend','<button id="annotationsToggle" aria-pressed="true" aria-label="显示或隐藏地图箭头、序号与流动效果">箭头与序号：开</button>');
function setAnnotations(visible){annotationsVisible=visible;mapSvg.setAttribute('data-annotations',String(visible));$('#annotationsToggle').setAttribute('aria-pressed',String(visible));controlIcon('#annotationsToggle','marks',visible?'隐藏箭头与序号':'显示箭头与序号')}
$('#annotationsToggle').addEventListener('click',()=>setAnnotations(!annotationsVisible));
const paintBeforeFlow=paintStep;paintStep=function(){mapSvg.setAttribute('data-sequence','true');paintBeforeFlow()};
const leaveBeforeFlow=leaveSequence;leaveSequence=function(){mapSvg.setAttribute('data-sequence','false');leaveBeforeFlow()};
setAnnotations(true);drawOverview();
// 用屏幕变换的逆比例补偿标注大小；位置仍随地图坐标移动。
function syncScreenSizes(){
 const matrix=mapSvg.getScreenCTM();if(!matrix)return;
 const scale=Math.hypot(matrix.a,matrix.b);if(!scale)return;const inverse=1/scale;
 document.querySelectorAll('.order-badge').forEach(g=>{const position=g.getAttribute('transform').replace(/\s*scale\([^)]*\)/g,'');g.setAttribute('transform',position+' scale('+inverse+')')});
 document.querySelectorAll('#journey circle,#nodes circle').forEach(c=>{if(!c.dataset.baseRadius)c.dataset.baseRadius=c.getAttribute('r');c.setAttribute('r',Number(c.dataset.baseRadius)*inverse)});
 document.querySelectorAll('.step-label,.city-label').forEach(t=>{t.style.fontSize=(t.classList.contains('step-label')?11:10)*inverse+'px'});
 document.querySelectorAll('.city-label').forEach(t=>{t.setAttribute('x',Number(t.dataset.anchorX)+9*inverse);t.setAttribute('y',Number(t.dataset.anchorY)+3*inverse)});
 // 端点短实线按屏幕长度绘制，中间仍保留流动虚线。
 document.querySelectorAll('.endpoint-caps').forEach(p=>p.remove());
 document.querySelectorAll('.flow-line').forEach(line=>{const length=line.getTotalLength()*scale,cap=Math.min(7,length/2);if(!length)return;const p=line.cloneNode(false);p.removeAttribute('class');p.removeAttribute('style');p.setAttribute('class','endpoint-caps');p.setAttribute('fill','none');p.setAttribute('stroke-width',line.closest('#journey')?'3.4':'2.4');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-dasharray',cap+' '+Math.max(0,length-2*cap)+' '+cap+' '+(length+1));p.setAttribute('pointer-events','none');line.parentNode.insertBefore(p,line)});
 const arrow=$('#trip-arrow');arrow.setAttribute('markerUnits','userSpaceOnUse');arrow.setAttribute('markerWidth',11*inverse);arrow.setAttribute('markerHeight',11*inverse);
}
const viewBeforeSizing=applyView;applyView=function(){viewBeforeSizing();syncScreenSizes()};
const overviewBeforeSizing=drawOverview;drawOverview=function(){overviewBeforeSizing();syncScreenSizes()};
const stepBeforeSizing=paintStep;paintStep=function(){stepBeforeSizing();syncScreenSizes()};
// 原按钮已绑定旧函数，需要在它们完成绘制后同步标注大小。
$('#overview').addEventListener('click',syncScreenSizes);$('#reset').addEventListener('click',syncScreenSizes);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(syncScreenSizes).observe(mapSvg);
syncScreenSizes();

function controlIcon(selector,name,label){
const paths={plus:'M12 5v14M5 12h14',minus:'M5 12h14',reset:'M3 10a9 9 0 1 1 2 8M3 4v6h6',expand:'M8 3H3v5M16 3h5v5M21 16v5h-5M8 21H3v-5',exit:'M3 8h5V3M21 8h-5V3M16 21v-5h5M8 21v-5H3',prev:'M15 5l-7 7 7 7',next:'M9 5l7 7-7 7',play:'M8 4l12 8-12 8Z',pause:'M8 4v16M16 4v16',marks:'M4 19L19 4M10 4h9v9M4 4h2M4 8h2'};
const button=$(selector);button.innerHTML='<svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[name]+'"/></svg>';button.setAttribute('aria-label',label);button.title=label;
}
[['#zoomIn','plus','放大'],['#zoomOut','minus','缩小'],['#zoomReset','reset','复位'],['#mapFullscreen','expand','全屏'],['#prev','prev','上一程'],['#next','next','下一程'],['#play','play','播放']].forEach(args=>controlIcon(...args));
</script></body></html>
