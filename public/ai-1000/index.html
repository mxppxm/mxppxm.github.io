<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用 AI 能做的 1000 件事 · 选择器</title>
<style>
  :root{
    --bg:#f7f3ea; --paper:#fffdf8; --ink:#2b2620; --ink-soft:#6b6255;
    --line:#e3dbcb; --accent:#b4451f; --accent-soft:#f2e2da; --gold:#c9a24b;
    --shadow:0 1px 2px rgba(60,45,25,.05), 0 8px 24px rgba(60,45,25,.06);
  }
  html[data-theme="dark"]{
    --bg:#1b1917; --paper:#232120; --ink:#e9e3d6; --ink-soft:#a49b8b;
    --line:#37332e; --accent:#e07a52; --accent-soft:#3a2a23; --gold:#d8b56a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
  html[data-theme="light"]{ color-scheme:light; }
  html[data-theme="dark"]{ color-scheme:dark; }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:32px 20px 120px}
  h1{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    font-size:clamp(28px,4.4vw,46px); line-height:1.22; margin:0 0 10px; letter-spacing:.5px;
  }
  h1 .accent{color:var(--accent)}
  .sub{color:var(--ink-soft); margin:0 0 22px; font-size:16px}
  .panel{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:18px 20px; margin-bottom:22px;
  }
  .barrow{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .bar{flex:1 1 240px; height:10px; background:var(--accent-soft); border-radius:99px; overflow:hidden}
  .bar > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--accent)); border-radius:99px; transition:width .25s}
  .count{font-variant-numeric:tabular-nums; font-weight:700; font-size:18px; white-space:nowrap}
  .count small{color:var(--ink-soft); font-weight:400; font-size:14px}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  button{
    font:inherit; font-size:15px; cursor:pointer; border-radius:9px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:8px 14px; transition:.15s;
  }
  button:hover{border-color:var(--accent); color:var(--accent)}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  button.primary:hover{filter:brightness(1.08); color:#fff}
  .tools{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
  input[type=text],select{
    font:inherit; font-size:15px; padding:9px 12px; border-radius:9px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
  }
  input[type=text]{min-width:220px; flex:1 1 220px}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:24px; max-height:none}
  .chip{
    font-size:14px; padding:5px 12px; border-radius:99px; cursor:pointer;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft); white-space:nowrap;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .sec{margin:0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .sec h2{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    font-size:21px; margin:28px 0 0; font-weight:700;
  }
  .sec .tagcount{color:var(--ink-soft); font-size:14px; font-variant-numeric:tabular-nums}
  .grid{
    display:grid; gap:12px; margin-top:14px;
    grid-template-columns:repeat(auto-fill,minmax(272px,1fr));
  }
  .card{
    position:relative; background:var(--paper); border:1px solid var(--line);
    border-radius:12px; padding:14px 16px 15px; cursor:pointer;
    transition:.15s; user-select:none;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-1px)}
  .card .t{font-weight:600; font-size:16.5px; line-height:1.5; padding-right:26px}
  .card .d{color:var(--ink-soft); font-size:14px; margin-top:6px; line-height:1.6}
  .card .mk{
    position:absolute; top:13px; right:14px; width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-size:13px; color:transparent;
  }
  .card.on{border-color:var(--accent); background:var(--accent-soft)}
  .card.on .mk{background:var(--accent); border-color:var(--accent); color:#fff}
  .card.rec .t::after{content:" ⭐"; font-size:13px}
  .card.flash{animation:flash 1.1s ease}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(180,69,31,0)}40%{box-shadow:0 0 0 5px rgba(180,69,31,.35)}}
  .more{
    margin:14px 0 0; font-size:15px; color:var(--accent);
    background:transparent; border:1px dashed var(--line); border-radius:10px;
    padding:9px 16px; width:100%;
  }
  .pick{
    display:none; margin-bottom:22px; padding:22px 24px; border-radius:14px;
    background:var(--paper); border:2px solid var(--accent); text-align:center;
  }
  .pick.show{display:block}
  .pick .label{color:var(--ink-soft); font-size:14px; letter-spacing:2px}
  .pick .val{
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
    font-size:clamp(20px,3vw,28px); font-weight:700; color:var(--accent); margin:8px 0 4px;
  }
  .pick .hint{color:var(--ink-soft); font-size:14px}
  .custombox{margin-top:34px}
  .customrow{display:flex; gap:10px; flex-wrap:wrap; margin:12px 0}
  .customrow input[type=text]{flex:1 1 260px}
  .empty{color:var(--ink-soft); font-size:15px; padding:8px 0}
  #modal{display:none; position:fixed; inset:0; background:rgba(25,20,12,.55); padding:24px; z-index:50; align-items:center; justify-content:center}
  #modal.show{display:flex}
  #modal .box{background:var(--paper); border-radius:16px; width:min(780px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #modal .head{padding:18px 22px; border-bottom:1px solid var(--line); font-weight:700; font-size:18px}
  #modal textarea{
    flex:1; min-height:46vh; border:0; outline:0; resize:none; padding:18px 22px;
    font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:var(--paper); color:var(--ink);
  }
  #modal .foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
  .toast{
    position:fixed; left:50%; bottom:32px; transform:translate(-50%,20px);
    background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:99px;
    font-size:15px; opacity:0; pointer-events:none; transition:.25s; z-index:99;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .theme{position:fixed; top:18px; right:18px; z-index:40; border-radius:99px; padding:7px 13px; font-size:14px; background:var(--paper); box-shadow:var(--shadow)}
  footer{margin-top:46px; color:var(--ink-soft); font-size:14px; text-align:center; line-height:1.9}

  /* ===== 手机端适配（仅窄屏生效，桌面端完全不受影响） ===== */
  @media (max-width: 640px){
    body{ font-size:16px; }
    .wrap{ padding:58px 14px 90px; }
    .theme{ top:12px; right:12px; padding:6px 11px; font-size:13px; }
    h1{ font-size:clamp(26px,8vw,34px); line-height:1.28; }
    .sub{ font-size:15px; }
    .panel{ padding:14px 16px; }
    .barrow{ gap:8px; }
    .bar{ flex:1 1 100%; order:3; }
    .count{ font-size:16px; }
    .btns button{ flex:1 1 auto; }
    button{ font-size:15px; padding:10px 14px; }
    .tools{ gap:8px; }
    input[type=text],select{ font-size:16px; min-width:0; }
    .chips{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px; margin-bottom:18px; }
    .chip{ flex:0 0 auto; padding:7px 13px; }
    .sec h2{ font-size:19px; margin-top:24px; }
    .grid{ grid-template-columns:1fr; gap:10px; }
    .card{ padding:13px 14px 14px; }
    .card .t{ font-size:16px; }
    .card .d{ font-size:13.5px; }
    .more{ font-size:14px; padding:11px 14px; }
    .pick{ padding:18px 16px; }
    .customrow input[type=text]{ flex:1 1 100%; }
    .customrow select,.customrow button{ flex:1 1 auto; }
    #modal{ padding:10px; }
    #modal .head{ padding:14px 16px; font-size:16px; }
    #modal textarea{ padding:14px 16px; min-height:50vh; font-size:13px; }
    #modal .foot{ padding:12px 16px; }
    #modal .foot button{ flex:1 1 auto; }
    footer{ font-size:13px; }
  }
</style>
</head>
<body>

<button class="theme" id="themeBtn" type="button">🌗 换色</button>

<div class="wrap">
  <h1>用 AI 能做的 <span class="accent" id="totalN">1000</span> 件事</h1>
  <p class="sub">别问"我该做什么"，先勾。勾完把结果发我，我给你排成能执行的计划。</p>

  <div class="panel">
    <div class="barrow">
      <div class="count">已选 <span id="n">0</span> <small>/ <span id="totalN2">1000</span></small></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="count" id="pct" style="min-width:58px; text-align:right">0%</div>
    </div>
    <div class="btns">
      <button class="primary" id="btnRandom" type="button">🎲 抽一个我现在就干</button>
      <button id="btnAll" type="button">全选</button>
      <button id="btnNone" type="button">全不选</button>
      <button id="btnRec" type="button">只留推荐 ⭐</button>
      <button class="primary" id="btnExport" type="button">📤 导出我的选择</button>
    </div>
  </div>

  <div class="tools">
    <input type="text" id="search" placeholder="搜一下：写作 / 自动化 / 摆烂 / 搞钱 / 前端 …" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>

  <div class="pick" id="pick">
    <div class="label">不纠结，就它了</div>
    <div class="val" id="pickVal">—</div>
    <div class="hint" id="pickHint"></div>
  </div>

  <div id="list"></div>

  <div class="custombox">
    <div class="sec"><h2>✏️ 我的自定义</h2><span class="tagcount" id="cn">0 条</span></div>
    <div class="customrow">
      <input type="text" id="cTitle" placeholder="自己想干的事，比如：给猫做个名片" autocomplete="off">
      <select id="cCat"></select>
      <button id="btnAdd" type="button">添加</button>
    </div>
    <div class="grid" id="customGrid"></div>
  </div>

  <footer>
    勾选状态自动保存在本机浏览器里 · 用同一个浏览器打开就还在<br>
    如果保存失效（换浏览器 / 无痕模式），直接点导出复制走也一样
  </footer>
</div>

<div id="modal">
  <div class="box">
    <div class="head">复制下面的内容，发回给 AI 👇</div>
    <textarea id="out" spellcheck="false"></textarea>
    <div class="foot">
      <button id="btnCopy" type="button">复制文本</button>
      <button id="btnDl" type="button">下载 .md</button>
      <button class="primary" id="btnClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  var STORE_KEY = "ai_ideas_pick_1000_v1";
  var store = { checked:{}, custom:[], theme:"" };
  var PAGE_SIZE = 24;

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var obj = JSON.parse(raw);
        if(obj && typeof obj === "object"){
          store.checked = obj.checked || {};
          store.custom = obj.custom || [];
          store.theme = obj.theme || "";
        }
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
  function keyOf(cat, title){ return cat + "|" + title; }
  function isOn(k){ return store.checked[k] === true; }

  function seedDefaults(){
    for(var i=0;i<ITEMS.length;i++){
      var k = keyOf(ITEMS[i][0], ITEMS[i][1]);
      if(store.checked[k] === undefined){ store.checked[k] = (ITEMS[i][3] === 1); }
    }
    for(var j=0;j<store.custom.length;j++){
      var ck = keyOf("custom", store.custom[j].title);
      if(store.checked[ck] === undefined){ store.checked[ck] = true; }
    }
  }

  var catName = {};
  for(var ci=0;ci<CATS.length;ci++){ catName[CATS[ci][0]] = CATS[ci][1]; }

  var curCat = "all";
  var curQuery = "";
  var expanded = {};

  var listEl = document.getElementById("list");
  var customGrid = document.getElementById("customGrid");
  var chipsEl = document.getElementById("chips");
  var nEl = document.getElementById("n");
  var pctEl = document.getElementById("pct");
  var barFill = document.getElementById("barFill");
  var searchEl = document.getElementById("search");
  var cCatEl = document.getElementById("cCat");
  var cTitleEl = document.getElementById("cTitle");
  var modal = document.getElementById("modal");
  var outEl = document.getElementById("out");
  var toastEl = document.getElementById("toast");
  var TOTAL = ITEMS.length;

  document.getElementById("totalN").textContent = TOTAL;
  document.getElementById("totalN2").textContent = TOTAL;

  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function buildCard(cat, title, desc, rec, k){
    var d = document.createElement("div");
    d.className = "card" + (rec ? " rec" : "") + (isOn(k) ? " on" : "");
    d.setAttribute("data-k", k);
    d.innerHTML = '<div class="mk">✓</div><div class="t">' + esc(title) + '</div>' +
                  (desc ? '<div class="d">' + esc(desc) + '</div>' : '');
    d.addEventListener("click", function(){
      store.checked[k] = !isOn(k);
      d.classList.toggle("on", isOn(k));
      save(); refreshStats(); refreshCatCounts();
    });
    return d;
  }

  function refreshCatCounts(){
    var heads = listEl.querySelectorAll(".sec[data-cat]");
    for(var i=0;i<heads.length;i++){
      var grid = heads[i].nextElementSibling;
      if(!grid) continue;
      var total = grid.querySelectorAll(".card").length;
      var on = grid.querySelectorAll(".card.on").length;
      var badge = heads[i].querySelector(".tagcount");
      if(badge) badge.textContent = "已显示 " + total + " 条 · 已选 " + on;
    }
    var cOn = customGrid.querySelectorAll(".card.on").length;
    var cTotal = customGrid.querySelectorAll(".card").length;
    document.getElementById("cn").textContent = cTotal ? (cOn + " / " + cTotal + " 条") : "0 条";
  }

  function countSelected(){
    var on = 0;
    for(var i=0;i<ITEMS.length;i++){ if(isOn(keyOf(ITEMS[i][0], ITEMS[i][1]))) on++; }
    for(var j=0;j<store.custom.length;j++){ if(isOn(keyOf("custom", store.custom[j].title))) on++; }
    return on;
  }

  function refreshStats(){
    var on = countSelected();
    var total = TOTAL + store.custom.length;
    nEl.textContent = on;
    var pct = total ? Math.round(on * 100 / total) : 0;
    pctEl.textContent = pct + "%";
    barFill.style.width = pct + "%";
  }

  function match(it){
    var k = keyOf(it[0], it[1]);
    if(curCat === "selected"){ if(!isOn(k)) return false; }
    else if(curCat !== "all" && it[0] !== curCat){ return false; }
    if(!curQuery) return true;
    var q = curQuery.toLowerCase();
    return (it[1] + " " + it[2] + " " + catName[it[0]]).toLowerCase().indexOf(q) >= 0;
  }

  function render(){
    listEl.innerHTML = "";
    var shown = 0, hiddenTotal = 0;
    for(var c=0;c<CATS.length;c++){
      var catId = CATS[c][0];
      var rows = [];
      for(var i=0;i<ITEMS.length;i++){
        if(ITEMS[i][0] === catId && match(ITEMS[i])) rows.push(ITEMS[i]);
      }
      if(!rows.length) continue;

      var limit = (expanded[catId] || curQuery) ? rows.length : Math.min(PAGE_SIZE, rows.length);
      var visible = rows.slice(0, limit);
      shown += visible.length;
      hiddenTotal += (rows.length - visible.length);

      var sec = document.createElement("div");
      sec.className = "sec";
      sec.setAttribute("data-cat", catId);
      sec.innerHTML = '<h2>' + CATS[c][1] + '</h2><span class="tagcount"></span>';
      listEl.appendChild(sec);

      var grid = document.createElement("div");
      grid.className = "grid";
      for(var r=0;r<visible.length;r++){
        grid.appendChild(buildCard(visible[r][0], visible[r][1], visible[r][2], visible[r][3], keyOf(visible[r][0], visible[r][1])));
      }
      listEl.appendChild(grid);

      if(rows.length > visible.length){
        (function(id, rest){
          var more = document.createElement("button");
          more.type = "button";
          more.className = "more";
          more.textContent = "展开这一类其余的 " + rest + " 条 ↓";
          more.addEventListener("click", function(){
            expanded[id] = true;
            render();
          });
          listEl.appendChild(more);
        })(catId, rows.length - visible.length);
      }
    }
    if(!shown){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = (curCat === "selected")
        ? "还没勾选任何条目 —— 先去随便勾几条吧。"
        : "没匹配到，换个词试试 —— 或者直接在下面自定义一条。";
      listEl.appendChild(empty);
    }
    if(hiddenTotal){
      var note = document.createElement("div");
      note.className = "empty";
      note.textContent = "还有 " + hiddenTotal + " 条被折叠起来了，点各类下面的按钮展开；也可以直接搜索。";
      listEl.appendChild(note);
    }
    refreshCatCounts();
  }

  function renderCustom(){
    customGrid.innerHTML = "";
    if(!store.custom.length){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "还没有自定义条目。想干的事写在上面的输入框里。";
      customGrid.appendChild(empty);
      refreshCatCounts();
      return;
    }
    for(var i=0;i<store.custom.length;i++){
      (function(idx){
        var c = store.custom[idx];
        var k = keyOf("custom", c.title);
        var card = buildCard("custom", c.title, "来自 " + (catName[c.cat] || "自定义"), 0, k);
        var del = document.createElement("button");
        del.type = "button";
        del.textContent = "删除";
        del.style.cssText = "position:absolute;right:12px;bottom:10px;font-size:12px;padding:3px 9px;border-radius:6px";
        del.addEventListener("click", function(ev){
          ev.stopPropagation();
          store.custom.splice(idx,1);
          delete store.checked[k];
          save(); renderCustom(); refreshStats();
        });
        card.appendChild(del);
        customGrid.appendChild(card);
      })(i);
    }
    refreshCatCounts();
  }

  function renderChips(){
    chipsEl.innerHTML = "";
    var defs = [["all","全部"],["selected","✅ 只看已选"]].concat(CATS);
    for(var i=0;i<defs.length;i++){
      (function(id, label){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (curCat === id ? " on" : "");
        b.textContent = label;
        b.addEventListener("click", function(){
          curCat = id; renderChips(); render();
          window.scrollTo({ top:0, behavior:"smooth" });
        });
        chipsEl.appendChild(b);
      })(defs[i][0], defs[i][1]);
    }
  }

  function fillCatSelect(){
    cCatEl.innerHTML = "";
    for(var i=0;i<CATS.length;i++){
      var o = document.createElement("option");
      o.value = CATS[i][0];
      o.textContent = CATS[i][1];
      cCatEl.appendChild(o);
    }
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1800);
  }

  document.getElementById("btnAll").addEventListener("click", function(){
    for(var i=0;i<ITEMS.length;i++){ store.checked[keyOf(ITEMS[i][0], ITEMS[i][1])] = true; }
    for(var j=0;j<store.custom.length;j++){ store.checked[keyOf("custom", store.custom[j].title)] = true; }
    save(); render(); renderCustom(); refreshStats(); toast("全选好了，冷静，挑几条就够");
  });
  document.getElementById("btnNone").addEventListener("click", function(){
    store.checked = {};
    for(var i=0;i<ITEMS.length;i++){ store.checked[keyOf(ITEMS[i][0], ITEMS[i][1])] = false; }
    for(var j=0;j<store.custom.length;j++){ store.checked[keyOf("custom", store.custom[j].title)] = false; }
    save(); render(); renderCustom(); refreshStats(); toast("清空了，白纸一张");
  });
  document.getElementById("btnRec").addEventListener("click", function(){
    for(var i=0;i<ITEMS.length;i++){
      store.checked[keyOf(ITEMS[i][0], ITEMS[i][1])] = (ITEMS[i][3] === 1);
    }
    save(); render(); renderCustom(); refreshStats(); toast("只留 ⭐ 推荐项了");
  });

  document.getElementById("btnRandom").addEventListener("click", function(){
    var pool = [];
    for(var i=0;i<ITEMS.length;i++){
      var k = keyOf(ITEMS[i][0], ITEMS[i][1]);
      if(!isOn(k)) pool.push(ITEMS[i]);
    }
    if(!pool.length){ for(var j=0;j<ITEMS.length;j++) pool.push(ITEMS[j]); }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var kk = keyOf(pick[0], pick[1]);
    store.checked[kk] = true;
    save();
    document.getElementById("pick").classList.add("show");
    document.getElementById("pickVal").textContent = pick[1];
    document.getElementById("pickHint").textContent = (catName[pick[0]] || "") + (pick[2] ? " · " + pick[2] : "");
    if(curCat === "selected"){
      curCat = "all"; renderChips();
    }
    expanded[pick[0]] = true;
    render(); refreshStats();
    var node = listEl.querySelector('.card[data-k="' + kk.replace(/"/g,'\\"') + '"]');
    if(node){
      node.scrollIntoView({ behavior:"smooth", block:"center" });
      node.classList.add("flash");
      setTimeout(function(){ node.classList.remove("flash"); }, 1200);
    }
  });

  document.getElementById("btnAdd").addEventListener("click", function(){
    var t = cTitleEl.value.trim();
    if(!t){ toast("先写点东西吧"); return; }
    store.custom.push({ cat: cCatEl.value, title: t });
    store.checked[keyOf("custom", t)] = true;
    cTitleEl.value = "";
    save(); renderCustom(); refreshStats(); toast("加好了 ✓");
  });
  cTitleEl.addEventListener("keydown", function(e){ if(e.key === "Enter"){ document.getElementById("btnAdd").click(); } });

  searchEl.addEventListener("input", function(){
    curQuery = searchEl.value.trim();
    render();
  });

  function buildMarkdown(){
    var lines = [];
    var onItems = [];
    for(var i=0;i<ITEMS.length;i++){
      if(isOn(keyOf(ITEMS[i][0], ITEMS[i][1]))) onItems.push(ITEMS[i]);
    }
    var onCustom = [];
    for(var j=0;j<store.custom.length;j++){
      if(isOn(keyOf("custom", store.custom[j].title))) onCustom.push(store.custom[j]);
    }
    var totalOn = onItems.length + onCustom.length;

    lines.push("# 我想用 AI 做的事");
    lines.push("");
    lines.push("> 共选中 " + totalOn + " 条（候选 " + TOTAL + " 条，自定义 " + onCustom.length + " 条）");
    lines.push("> 导出时间：" + new Date().toLocaleString("zh-CN"));
    lines.push("");
    for(var c=0;c<CATS.length;c++){
      var catId = CATS[c][0];
      var rows = [];
      for(var m=0;m<onItems.length;m++){ if(onItems[m][0] === catId) rows.push(onItems[m]); }
      if(!rows.length) continue;
      lines.push("## " + CATS[c][1]);
      for(var r=0;r<rows.length;r++){
        lines.push("- [ ] **" + rows[r][1] + "** —— " + rows[r][2]);
      }
      lines.push("");
    }
    if(onCustom.length){
      lines.push("## ✏️ 我的自定义");
      for(var p=0;p<onCustom.length;p++){
        lines.push("- [ ] **" + onCustom[p].title + "** —— 来自 " + (catName[onCustom[p].cat] || "自定义"));
      }
      lines.push("");
    }
    if(!totalOn){
      lines.push("_（还没勾选任何条目）_");
      lines.push("");
    }
    lines.push("---");
    lines.push("请按我的选择，帮我排一份能立刻开始的计划：按上手难度和今天可完成度排序，每天只安排 1 到 2 件事。");
    return lines.join("\n");
  }

  document.getElementById("btnExport").addEventListener("click", function(){
    outEl.value = buildMarkdown();
    modal.classList.add("show");
    outEl.focus();
    outEl.setSelectionRange(0,0);
  });
  document.getElementById("btnClose").addEventListener("click", function(){ modal.classList.remove("show"); });
  modal.addEventListener("click", function(e){ if(e.target === modal) modal.classList.remove("show"); });

  document.getElementById("btnCopy").addEventListener("click", function(){
    var txt = outEl.value;
    try{
      outEl.focus(); outEl.select();
      if(document.execCommand("copy")){ toast("已复制，粘给我就行 ✓"); return; }
    }catch(e){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("已复制 ✓"); }, function(){ toast("请手动全选复制"); });
    } else {
      toast("请手动全选复制");
    }
  });

  document.getElementById("btnDl").addEventListener("click", function(){
    try{
      var blob = new Blob(["\ufeff" + outEl.value], { type:"text/markdown;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "my-ai-todo-1000.md";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
      toast("已下载 my-ai-todo-1000.md");
    }catch(e){ toast("下载失败，请手动复制"); }
  });

  function applyTheme(t){
    if(t === "dark" || t === "light"){ document.documentElement.setAttribute("data-theme", t); }
    else {
      var m = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", m ? "dark" : "light");
    }
  }
  document.getElementById("themeBtn").addEventListener("click", function(){
    var now = document.documentElement.getAttribute("data-theme");
    store.theme = (now === "dark") ? "light" : "dark";
    applyTheme(store.theme); save();
  });

  load();
  applyTheme(store.theme);
  seedDefaults();
  save();
  fillCatSelect();
  renderChips();
  render();
  renderCustom();
  refreshStats();
})();
</script>
</body>
</html>
